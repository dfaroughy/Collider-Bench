[histogram]
file          = "histogram_T5Wg_STgamma.yaml"       # template yaml the agent fills in
header_name   = "T5Wg_1750_1700"         # matches the histogram column header
task = """
Fill null histogram values for eacfh bin with event counts normalized to
luminosity 35.9 fb^-1. In the rightmost bin include ALL events with
S_T^gamma > 1300 GeV. Do not modify bin edges.
"""
description   = "STgamma event counts for signal region events."
benchmark     = "T5Wg, gluino 1750 GeV, NLSP 1700 GeV, Massless LSP"
obs           = "DSIG/DSTGAMMA"
cm_energy_gev = 13000
luminosity_fb = 35.9
