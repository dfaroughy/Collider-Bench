# Usage:
#   scripts/run-agent --config configs/codex_anneal.yaml
#   scripts/run-agent --config configs/codex_anneal.yaml --effort high --max-iters 3

extends: base.yaml

agent:   anneal
task:    sus-16-047_sim-T5Wg_highHT    # see LHCRecastBench/tasks/
runner:  codex
model:   gpt-5.5
effort:  high
max_iters: 6
min_iters: 3

# Examiner + planner roles reuse the same codex model for now — codex has no
# cheap-tier equivalent to Sonnet that we can swap in without changing providers.
examiner_model:  gpt-5.4
examiner_effort: medium
planner_effort:  low

anneal_t0:        1.0
anneal_schedule:  cosine
max_rollbacks:    3
