# Usage:
#   scripts/run-agent --config configs/aider_deepseek.yaml
#
# Aider drives many model backends through litellm. The model string is
# of the form "<provider>/<model-id>"; auth is per-provider via the
# canonical provider API key. The aider runner forwards a fixed allowlist
# of provider secrets; the sandbox does not wildcard-forward *_API_KEY.
#
# Common picks:
#   deepseek/deepseek-chat       — V3, fast, cheap
#   deepseek/deepseek-reasoner   — R1, reasoning, slower
#   openrouter/anthropic/claude-sonnet-4
#   gemini/gemini-2.5-pro
#   ollama/llama3                — local, no API key
#
# Effort: aider has no universal thinking-tokens flag across the 75+
# backends, so `effort` is ignored.

agent:   simple
task:    sus-16-046_yield-TChiWg    # see LHCRecastBench/tasks/
runner:  aider
model:   deepseek/deepseek-chat
effort:  medium                     # ignored by aider
extends: clusters/perlmutter.yaml
