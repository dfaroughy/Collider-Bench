# Usage:
#   scripts/run-agent --config configs/gemini_sisyphus.yaml
#   scripts/run-agent --config configs/gemini_sisyphus.yaml --max-iters 3
#
# Gemini CLI has no reasoning-budget flag; effort values are ignored by the
# runner. Model auto-routing on the server handles tier selection.

extends: base.yaml

agent:   sisyphus
task:    sus-16-047-simulate-T5Wg-highHT-pTmiss    # see LHCRecastBench/tasks/
runner:  gemini
model:   gemini-3-pro-preview
effort:  medium
max_iters: 5
min_iters: 3

# Critic + planner roles reuse the same gemini model — auto-routing will
# drop to flash / flash-lite for the lighter critic/planner turns on its own.
critic_model:   gemini-3-pro-preview
critic_effort:  low
planner_effort: low
