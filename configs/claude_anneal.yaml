# Usage:
#   scripts/run-agent --config configs/claude_anneal.yaml
#   scripts/run-agent --config configs/claude_anneal.yaml --effort high --max-iters 3

extends: base.yaml

agent:   anneal
task:    sus-16-047-simulate-T5Wg-highHT-pTmiss    # see LHCRecastBench/tasks/
runner:  claude
model:   claude-opus-4-7
effort:  max
max_iters: 6
min_iters: 3

# Examiner + planner roles run on a cheaper model to keep loop cost bounded.
examiner_model:  claude-sonnet-4-6
examiner_effort: high
planner_effort:  medium

# Annealing: cosine schedule from T0 down to 0 across max_iters. Stochastic
# rollback rewinds the next iter's seed to the best-so-far on regression
# (capped at max_rollbacks per run).
anneal_t0:        1.0
anneal_schedule:  cosine
max_rollbacks:    3
