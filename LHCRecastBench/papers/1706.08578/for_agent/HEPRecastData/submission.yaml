additional_resources:
- {description: DOI of the article, location: 'http://www.sciencedirect.com/science/article/pii/S0370269317308936?via%3Dihub'}
- {description: arXive, location: 'https://arxiv.org/abs/1706.08578v3'}
comment: |
  CERN-LHC. Search for physics beyond the standard model in the final state with two same-flavour leptons (electrons or muons) and two quarks produced in proton-proton collisions at a center of mass energy of 13 TeV.

  The data correspond to an integrated luminosity of 2.3 /fb. The results of the measurement are interpreted in the framework of a heavy Majorana neutrino stems from a composite-fermion scenario.
hepdata_doi: 10.17182/hepdata.80512.v1
