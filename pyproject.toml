[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lhc-recast"
version = "0.1.0"
description = "LHC-Recast benchmark and agent infrastructure for CMS paper recasting."
requires-python = ">=3.10"
readme = "README.md"
authors = [{ name = "Darius Faroughy", email = "dariusfar@gmail.com" }]

dependencies = [
    "pyyaml>=6",
    "pydantic>=2",       # declarative RunnerSpec validation
    "numpy>=1.24",
    "scipy>=1.10",       # chi2 + kstwobign for Baker-Cousins p-values
    "awkward>=2",
    "uproot>=5",
    "hist",
    "mplhep",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-xdist",
]
# Only needed when (re)building/pushing the HF task corpus via
# hub/build_hf_dataset.py — kept out of the default install so non-publishers
# don't pull these deps.
hub = [
    "datasets>=2.18",
    "huggingface_hub>=0.20",
]

[project.scripts]
# Convenience entry point — the production path is still `scripts/run-agent`,
# which also handles Perlmutter salloc/srun wrapping.
lhc-recast-simple = "agents.simple.run:main"

[tool.setuptools.packages.find]
# Three top-level packages: runtime, benchmark, and the agents namespace.
include = ["agent_runtime*", "ColliderBench*", "agents*"]
exclude = ["recast_*", "old*", "runs*", "draft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fast smoke suite — don't swallow stdout, fail on the first network/file error.
addopts = "-ra --strict-markers"
markers = [
    "image: container-image audit suite (requires podman/podman-hpc + a built lhc-bench image; auto-skips otherwise). Run with `pytest -m image`; skip with `pytest -m 'not image'`.",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Don't lint upstream-vendored code or historical scratch dirs.
extend-exclude = [
    "ColliderBench/tools/sim/MG5_aMC_v3_7_0",
    "ColliderBench/tools/sim/delphes",
    "ColliderBench/tools/sim/pythia8313",  # upstream Pythia examples
    "old",
    "runs",
    "draft",
]

[tool.ruff.lint]
# Start conservative — errors, pyflakes, bugbear, comprehensions, unused imports.
# Can tighten later by adding "N" (pep8-naming), "UP" (pyupgrade), "SIM", "I".
select = ["E", "F", "B", "C4", "W"]
# Long lines in shell docstrings / URLs are a nuisance — let them be.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
