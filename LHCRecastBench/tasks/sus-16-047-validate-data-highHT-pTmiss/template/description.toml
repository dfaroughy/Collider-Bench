[histogram]
file          = "histogram_Obs_highHT_pTmiss.yml"
header_name   = "Observed data"
task = """
Fill null histogram values for each bin with event counts normalized to
luminosity 35.9 fb^-1. In the rightmost bin include ALL events with
p_T^miss > 600 GeV. Do not modify bin edges.
"""
