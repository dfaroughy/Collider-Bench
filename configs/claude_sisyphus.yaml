# Usage:
#   scripts/run-agent --config configs/claude_sisyphus.yaml
#   scripts/run-agent --config configs/claude_sisyphus.yaml --effort high --max-iters 3

extends: base.yaml

agent:   sisyphus
paper:   "CMS-SUS-16-047"
runner:  claude
model:   claude-opus-4-7
effort:  1500
max_iters: 5
min_iters: 1

# Critic + planner roles run on a cheaper model to keep loop cost bounded.
critic_model:   claude-sonnet-4-6
critic_effort:  low
planner_effort: low
